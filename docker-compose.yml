# Local development stack for the Polymarket rebuild.
#
# Runs three future services (web, executor, python-worker) against a
# single Postgres. No Redis (per plan; add later only when measured need
# justifies it). No live network access to Polymarket — the executor
# service intentionally has no signer credentials in this compose file
# and the venue adapter refuses to instantiate without the three-flag
# gate.
#
# Boot:
#   docker compose up -d db
#   pnpm install && pnpm dev          # web on :4200
#   # once python/ lands (PR 1+): docker compose up python-worker
#   # once apps/executor lands (PR 8): docker compose up executor
#
# The web + executor + python-worker service definitions are scaffolds.
# They intentionally don't run anything yet — their build contexts and
# entrypoints will be filled in by the PRs that create their code.

services:
  db:
    # supabase/postgres (not stock postgres:16) because migrations
    # 001-004 and the new RLS/publication statements require pgvector,
    # the `supabase_realtime` publication, and the anon/authenticated/
    # service_role roles — all shipped by this image, none by stock
    # postgres. Pinned; bump deliberately.
    image: supabase/postgres:15.8.1.060
    container_name: nbe_theta_db
    restart: unless-stopped
    ports:
      - "54322:5432"
    environment:
      # Do NOT set POSTGRES_USER or POSTGRES_DB on this image. Its
      # bundled init scripts bootstrap as `supabase_admin` (the baked-in
      # default user); overriding the user breaks the image's own init
      # ('Role "supabase_admin" does not exist') and the container never
      # comes up healthy. Connect as supabase_admin to db `postgres` —
      # see DATABASE_URL in .env.example.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - db_data:/var/lib/postgresql/data
      # Migrations are applied explicitly via `pnpm migrate up`, NOT via
      # the initdb.d auto-run — migration 003 has non-idempotent
      # publication adds that would error on a double-apply, so a single
      # authoritative runner is used for both local dev and CI.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supabase_admin -h localhost"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Web (Next.js dashboard + control API).
  # Scaffold only — during development, run `pnpm dev` on the host and
  # point at db:54322. This service exists so the compose topology is
  # complete for later container-based deployment.
  web:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "4200:4200"
    environment:
      DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
      CONTROL_API_TOKEN: ${CONTROL_API_TOKEN}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL:-}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY:-}

  # Python worker (registry, ingest, ledger, scoring, signal generator).
  # Scaffold only — image will be built once python/nbe_theta lands.
  python-worker:
    profiles: [full]
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "theta-registry", "--loop"]
    environment:
      DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
      LOG_LEVEL: info

  # Wallet-activity live monitor: watchlist sync, positions snapshots,
  # leaderboard sweeps, heartbeats. Same image as python-worker.
  python-monitor:
    profiles: [full]
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "theta-live-monitor", "run"]
    environment:
      DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
      LOG_LEVEL: info
      MONITOR_INTERVAL_S: "30"

  # CLOB market-data collector: streams the order book for watchlisted
  # markets into market_quotes, and REST-resyncs after any stream gap.
  # This is what makes markouts and CLV computable. Same image again.
  python-market-data:
    profiles: [full]
    build:
      context: .
      dockerfile: python/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    command: ["uv", "run", "theta-market-data", "run"]
    environment:
      DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
      LOG_LEVEL: info
      MARKET_CYCLE_S: "15"

  # TypeScript executor (holds the signer; talks to Polymarket).
  # Scaffold only. In production this container runs on a private host,
  # never behind a public inbound endpoint.
  executor:
    profiles: [full]
    build:
      context: .
      dockerfile: apps/executor/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://supabase_admin:postgres@db:5432/postgres
      EXECUTION_PROVIDER: mock
      # The three live-CLOB flags are intentionally UNSET here.
      # Setting them requires deliberate operator action.
      # POLYMARKET_LIVE=false
      # CONFIRM_LIVE=NO

volumes:
  db_data: {}
