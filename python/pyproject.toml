[project]
name = "nbe-theta"
version = "0.1.0"
description = "NBE-Theta Python worker: Polymarket intelligence + signal layers (ingest, ledger, analytics, graph, signals, backtest)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    # Market-data websocket transport. Used only by
    # WebsocketMarketStream, behind the MarketStream seam, and
    # imported lazily so the book/parsing logic tests without it.
    "websockets>=13",
    "nbe-theta-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
theta-registry = "nbe_theta.ingest.cli:app"
theta-wallet-backfill = "nbe_theta.ingest.wallet_cli:app"
theta-score-wallets = "nbe_theta.analytics.cli:app"
theta-live-monitor = "nbe_theta.ingest.monitor_cli:app"
theta-market-data = "nbe_theta.ingest.market_cli:app"
theta-cohort = "nbe_theta.analytics.cohort_cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbe_theta"]

# The contracts package is the durable-payload source of truth; the
# ingest layer validates every row against it before writing. Resolved
# as an editable path dep from the monorepo checkout.
[tool.uv.sources]
nbe-theta-contracts = { path = "../packages/contracts", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares CLI options as call-valued defaults — that IS the
# framework's idiom, so B008 doesn't apply to the command modules.
"nbe_theta/ingest/cli.py" = ["B008"]
"nbe_theta/ingest/wallet_cli.py" = ["B008"]
"nbe_theta/analytics/cli.py" = ["B008"]
"nbe_theta/ingest/monitor_cli.py" = ["B008"]
"nbe_theta/ingest/market_cli.py" = ["B008"]
"nbe_theta/analytics/cohort_cli.py" = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["nbe_theta"]

[[tool.mypy.overrides]]
module = ["structlog.*", "websockets.*"]
ignore_missing_imports = true
