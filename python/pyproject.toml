[project]
name = "nbe-theta"
version = "0.1.0"
description = "NBE-Theta Python worker: Polymarket intelligence + signal layers (ingest, ledger, analytics, graph, signals, backtest)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "tenacity>=8.5",
    "psycopg[binary]>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "typer>=0.12",
    "nbe-theta-contracts",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "mypy>=1.10",
    "ruff>=0.5",
]

[project.scripts]
theta-registry = "nbe_theta.ingest.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbe_theta"]

# The contracts package is the durable-payload source of truth; the
# ingest layer validates every row against it before writing. Resolved
# as an editable path dep from the monorepo checkout.
[tool.uv.sources]
nbe-theta-contracts = { path = "../packages/contracts", editable = true }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["nbe_theta"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
