[project]
name = "nbe-theta-backtester"
version = "0.1.0"
description = "Offline backtesting + research sidecar for the NBE-Theta BTC quant stack"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "scipy>=1.12",
    "numba>=0.59",
    "joblib>=1.4",
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "supabase>=2.5",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.scripts]
backtest = "backtester.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backtester"]

[tool.ruff]
line-length = 100
