name: CI

on:
  push:
    branches: [main, rebuild/polymarket-v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (schema + TS regen check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      - name: Install Python deps
        working-directory: packages/contracts
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -e ".[dev]"

      - name: Regenerate schemas + TS
        working-directory: packages/contracts
        run: |
          .venv/bin/python -m nbe_theta_contracts.export schemas ./schemas
          node scripts/generate-ts.mjs

      - name: Diff-check
        run: git diff --exit-code -- packages/contracts/schemas packages/contracts/generated

      - name: Python contracts tests
        working-directory: packages/contracts
        run: .venv/bin/python -m pytest tests/python

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (@nbe-theta/contracts)
        working-directory: packages/contracts
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      # Build is temporarily excluded from CI because `main` has a
      # pre-existing typecheck failure in `ONCHAIN_THETA_AGENT/` (missing
      # `@coinbase/agentkit` dep). It will be reintroduced in a follow-up
      # PR that either fixes that subdir or excludes it from the build.

  python:
    name: Python (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `python/nbe_theta` package lands in PR 3. Until then only the
    # contracts package has Python code, and that's covered by the
    # `contracts` job. This job stays here as a skeleton so PR 3 can
    # populate it without touching the workflow shape.
    if: hashFiles('python/nbe_theta/**/*.py') != ''
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: uv sync
        working-directory: python
        run: uv sync --frozen

      - name: Ruff lint
        working-directory: python
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: python
        run: uv run ruff format --check .

      - name: Mypy
        working-directory: python
        run: uv run mypy nbe_theta

      - name: Pytest
        working-directory: python
        run: uv run pytest

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan every commit on a PR
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
