name: CI

on:
  push:
    branches: [main, rebuild/polymarket-v2]
  pull_request:

# Least-privilege GITHUB_TOKEN for every job (CodeQL: actions/missing-
# workflow-permissions). Jobs that need more declare it themselves.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (schema + TS regen check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # `pnpm contracts:check` self-bootstraps the Python env via
      # `uv run --frozen` (uv.lock is committed), regenerates schemas +
      # TS, and diffs against the checked-in tree.
      - name: Regenerate + diff-check
        run: pnpm contracts:check

      - name: Python contracts tests
        working-directory: packages/contracts
        run: uv run --frozen --extra dev pytest tests/python

      # The package's own filtered test entrypoint must work (it is the
      # README-documented command); guards the package vitest config.
      - name: TS contracts tests (package-filtered)
        run: pnpm --filter @nbe-theta/contracts test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (@nbe-theta/contracts)
        working-directory: packages/contracts
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      # Re-enabled: the blocker was ONCHAIN_THETA_AGENT/ (an orphaned
      # Coinbase AgentKit scaffold with unresolvable deps), deleted with
      # the rest of the BTC code.
      - name: Build
        run: pnpm build

  python:
    name: Python (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Covers python/nbe_theta (the worker package). The DB-backed
    # integration tests self-skip here (no DATABASE_URL); their logic is
    # also covered by the in-memory replay tests that always run.
    #
    # NOTE: the gate is a STEP (not a job-level `if`) because hashFiles()
    # is only available in step-level expression contexts — a job-level
    # hashFiles() makes GitHub reject the whole workflow file, silently
    # killing every job in it.
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Check python/nbe_theta exists
        run: echo "present=$([ -d python/nbe_theta ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v3
        if: steps.gate.outputs.present == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: uv sync
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv sync --frozen --extra dev

      - name: Ruff lint
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run ruff check .

      - name: Ruff format check
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run ruff format --check .

      - name: Mypy
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run mypy nbe_theta

      - name: Pytest
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run pytest

  database:
    name: Database (migrations + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # supabase/postgres provides pgvector + the supabase_realtime
    # publication + the anon/authenticated/service_role roles that
    # migrations 001-010 depend on.
    #
    # Do NOT override POSTGRES_USER/POSTGRES_DB on this image: its
    # bundled init scripts bootstrap as `supabase_admin` (the image's
    # baked-in POSTGRES_USER). Overriding the user makes initdb create
    # a different superuser and the image's own migrate step dies with
    # 'Role "supabase_admin" does not exist' before the container ever
    # goes healthy. We connect as supabase_admin — the actual superuser
    # and owner of the supabase_realtime publication — to the default
    # `postgres` database.
    services:
      db:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U supabase_admin -h localhost"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://supabase_admin:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships psql preinstalled; only install if a future
      # runner image drops it. Saves ~30s of apt-get per run.
      - name: Ensure psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Invoke the runner script directly so this job needs no node/pnpm
      # toolchain. `pnpm migrate up` is the identical local-dev alias.
      - name: Apply migrations from zero
        run: bash scripts/migrate.sh up

      - name: Re-apply is a no-op (idempotent ledger)
        run: |
          out="$(bash scripts/migrate.sh up)"
          echo "$out"
          echo "$out" | grep -q "applied 0 migration" || {
            echo "second migrate up should apply 0 migrations" >&2
            exit 1
          }

      - name: Schema smoke assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db-smoke.sql

      # The outbox integration test lives HERE, not in the typescript
      # job, because it is the only job with a database. It self-skips
      # without DATABASE_URL, so running it anywhere else would report a
      # silently-green integration test — which is worse than not having
      # one. `--no-coverage` keeps this focused run from tripping the
      # repo-wide coverage thresholds on a single file.
      # `version` is required: package.json has no `packageManager`
      # field, so the action has nothing to infer from and errors out
      # without it. Matches the contracts and typescript jobs.
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Run once, then assert it actually ran. A skip means the queries
      # were never executed against the schema, and the job would go
      # green on nothing — the precise failure this test exists to stop.
      # Asserted from vitest's JSON reporter, never from its pretty
      # output. An earlier version grepped the human summary for
      # "Tests N passed" and failed the job even though every test
      # passed: under CI=true vitest colourises that line, so the
      # regex was matching against `Tests ^[[22m ^[[1m^[[32m17 passed`.
      # A guard that scrapes formatted text is a guard that reports on
      # the formatting.
      - name: Outbox against real Postgres
        run: |
          set +e
          pnpm exec vitest run \
            apps/executor/src/__tests__/risk-gate-outbox-postgres.test.ts \
            --no-coverage --reporter=default --reporter=json \
            --outputFile=outbox-results.json
          rc=$?
          set -e

          node -e '
            const fs = require("node:fs");
            const rc = Number(process.argv[1]);
            let r;
            try {
              r = JSON.parse(fs.readFileSync("outbox-results.json", "utf8"));
            } catch (e) {
              console.log("::error::outbox test produced no JSON result: " + e.message);
              process.exit(1);
            }
            const { numPassedTests: p = 0, numFailedTests: f = 0, numPendingTests: s = 0 } = r;
            console.log(`outbox: ${p} passed, ${f} failed, ${s} skipped (exit ${rc})`);
            // A skip here means DATABASE_URL never reached the test and
            // the queries were never executed — green on nothing, which
            // is the failure this test exists to prevent.
            if (s > 0) {
              console.log("::error::outbox test skipped; DATABASE_URL not seen in this job");
              process.exit(1);
            }
            if (p === 0) {
              console.log("::error::outbox test ran no tests");
              process.exit(1);
            }
            if (f > 0 || rc !== 0) {
              const names = (r.testResults ?? [])
                .flatMap((t) => t.assertionResults ?? [])
                .filter((a) => a.status === "failed")
                .map((a) => `${a.fullName}: ${(a.failureMessages ?? []).join(" | ")}`)
                .join("%0A");
              console.log(`::error title=Outbox integration test failed::${names || "see log"}`);
              process.exit(1);
            }
          ' "$rc"

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # gitleaks-action annotates PRs when it finds leaks.
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan every commit on a PR
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
