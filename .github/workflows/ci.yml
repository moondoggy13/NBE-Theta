name: CI

on:
  push:
    branches: [main, rebuild/polymarket-v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts (schema + TS regen check)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JS deps
        run: pnpm install --frozen-lockfile

      # `pnpm contracts:check` self-bootstraps the Python env via
      # `uv run --frozen` (uv.lock is committed), regenerates schemas +
      # TS, and diffs against the checked-in tree.
      - name: Regenerate + diff-check
        run: pnpm contracts:check

      - name: Python contracts tests
        working-directory: packages/contracts
        run: uv run --frozen --extra dev pytest tests/python

      # The package's own filtered test entrypoint must work (it is the
      # README-documented command); guards the package vitest config.
      - name: TS contracts tests (package-filtered)
        run: pnpm --filter @nbe-theta/contracts test

  typescript:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck (root)
        run: pnpm typecheck

      - name: Typecheck (@nbe-theta/contracts)
        working-directory: packages/contracts
        run: npx tsc --noEmit

      - name: Test
        run: pnpm test

      # Build is temporarily excluded from CI because `main` has a
      # pre-existing typecheck failure in `ONCHAIN_THETA_AGENT/` (missing
      # `@coinbase/agentkit` dep). It will be reintroduced in a follow-up
      # PR that either fixes that subdir or excludes it from the build.

  python:
    name: Python (scaffold)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The `python/nbe_theta` package lands in PR 3. Until then only the
    # contracts package has Python code, and that's covered by the
    # `contracts` job. This job stays here as a skeleton so PR 3 can
    # populate it without touching the workflow shape.
    #
    # NOTE: the gate is a STEP (not a job-level `if`) because hashFiles()
    # is only available in step-level expression contexts — a job-level
    # hashFiles() makes GitHub reject the whole workflow file, silently
    # killing every job in it.
    steps:
      - uses: actions/checkout@v4

      - id: gate
        name: Check python/nbe_theta exists
        run: echo "present=$([ -d python/nbe_theta ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v3
        if: steps.gate.outputs.present == 'true'
        with:
          enable-cache: true

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.present == 'true'
        with:
          python-version: "3.12"

      - name: uv sync
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv sync --frozen

      - name: Ruff lint
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run ruff check .

      - name: Ruff format check
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run ruff format --check .

      - name: Mypy
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run mypy nbe_theta

      - name: Pytest
        if: steps.gate.outputs.present == 'true'
        working-directory: python
        run: uv run pytest

  database:
    name: Database (migrations + smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # supabase/postgres provides pgvector + the supabase_realtime
    # publication + the anon/authenticated/service_role roles that
    # migrations 001-010 depend on.
    services:
      db:
        image: supabase/postgres:15.8.1.060
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nbe_theta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/nbe_theta
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships psql preinstalled; only install if a future
      # runner image drops it. Saves ~30s of apt-get per run.
      - name: Ensure psql client
        run: command -v psql >/dev/null || (sudo apt-get update && sudo apt-get install -y postgresql-client)

      # Invoke the runner script directly so this job needs no node/pnpm
      # toolchain. `pnpm migrate up` is the identical local-dev alias.
      - name: Apply migrations from zero
        run: bash scripts/migrate.sh up

      - name: Re-apply is a no-op (idempotent ledger)
        run: |
          out="$(bash scripts/migrate.sh up)"
          echo "$out"
          echo "$out" | grep -q "applied 0 migration" || {
            echo "second migrate up should apply 0 migrations" >&2
            exit 1
          }

      - name: Schema smoke assertions
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/db-smoke.sql

  security:
    name: Security
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks needs full history to scan every commit on a PR
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
