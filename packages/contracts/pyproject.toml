[project]
name = "nbe-theta-contracts"
version = "1.0.0"
description = "Durable-payload contracts for NBE-Theta. Pydantic source of truth; JSON Schema exported to schemas/; TS generated in generated/ts/."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
nbe-theta-contracts-export = "nbe_theta_contracts.export:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["nbe_theta_contracts"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
strict = true
files = ["nbe_theta_contracts"]
